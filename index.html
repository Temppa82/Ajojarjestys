<main>

<script type="module">
const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
const { PDFDocument }=await import('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm');
pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const T={fi:{title:'PDF-lähetteet',drop:'Vedä PDF:t tähän tai valitse tiedostot.',acceptAll:'Hyväksy kaikki',optimize:'Optimoi',clear:'Tyhjennä',settings:'Asetukset',recipient:'Vastaanottaja',address:'Osoite',status:'Tila',start:'Lähtöosoite',end:'Päivän päättymisosoite',close:'Sulje',log:'Lataa loki',mergePdf:'Yhdistä ja lataa PDF:t',review:'Tarkista tiedot',save:'Hyväksy',ok:'✓ Hyväksytty',reviewStatus:'⚠ Tarkista',noAddress:'❌ Ei osoitetta',processing:'Käsitellään...',found:'PDF käsitelty',none:'Ei tunnistettu'},en:{title:'PDF referrals',drop:'Drop PDFs here or choose files.',acceptAll:'Accept all',optimize:'Optimize',clear:'Clear',settings:'Settings',recipient:'Recipient',address:'Address',status:'Status',start:'Start address',end:'End-of-day address',close:'Close',log:'Download log',mergePdf:'Merge and download PDFs',review:'Review data',save:'Accept',ok:'✓ Accepted',reviewStatus:'⚠ Review',noAddress:'❌ No address',processing:'Processing...',found:'PDF processed',none:'Not recognized'}};
const state={rows:[],lang:localStorage.ajLang||'fi',end:localStorage.ajEnd||'',start:localStorage.ajStart||'Itäinen valkoisenlähteentie 18, Vantaa',reviewIndex:-1};
const tr=k=>(T[state.lang]||T.fi)[k]||k;
function applyLang(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));document.getElementById('lang').value=state.lang}
applyLang();document.getElementById('start').value=state.start;document.getElementById('end').value=state.end;
function log(s){const a=JSON.parse(localStorage.ajLog||'[]');a.push(new Date().toISOString()+' '+s);localStorage.ajLog=JSON.stringify(a.slice(-500))}
const norm=s=>String(s||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
const metadata=/^(?:Lähetyspvm|Toimitusehto|Myyjä|Asiakasnumero|Tilausnumero|Käsittelijä|Keräilijä|Viitteenne|Asiakkaan tilausnumero|Seur\.?nro|Kolleja|Paino|Tilavuus|Yhteyshenkilö|Toim\.?as\.?\s*kontakti|VASTAANOTTAJA|As\.?\s*puh|Pyydetty toimituspvm|Arvioitu toimituspvm|Toimitusohje|Lähettäjä|Tilaaja|Viitenumeronne|Kuljetusliike)\b/i;
function postal(s){return /^\d{5}\s+[A-Za-zÅÄÖåäöÉéÈèÜü][A-Za-zÅÄÖåäöÉéÈüäö'\-]*(?:\s+[A-Za-zÅÄÖåäöÉéÈüäö'\-]*)*$/i.test(norm(s))}
function street(s){const m=norm(s);const tokens=m.split(' ');const bad=new Set(['oy','oyj','ab','ltd','inc','corp','co','caverion','management','attendo','aava','kauppakeskus','vastaanotto','toimitila','luotsiasema','siivous','palvelut','business','finland','suomi']);const suffix=/(tie|katu|kuja|polku|ranta|rannantie|väylä|aukio|tori|silta|rinne|mäki|niemi|laakso|portti|raitti|kaari|lähde)$/i;let best=null;
 for(let ni=1;ni<tokens.length;ni++){const nm=tokens[ni].match(/^(\d{1,4})([A-Za-zÅÄÖåäö]?)(?:[,.;:]?)$/);if(!nm)continue;for(let back=1;back<=Math.min(4,ni);back++){const ts=tokens.slice(ni-back,ni).map(x=>x.replace(/[,.;:]/g,''));if(ts.some(x=>bad.has(x.toLowerCase())))continue;const st=ts.join(' ');if(!/^[A-Za-zÅÄÖåäöÉéÈèÜü]/.test(st))continue;let score=back===1?40:back===2?20:5;if(suffix.test(st))score+=35;if(/\d/.test(st))score-=5;if(/^(?:Finland|Suomi|Sivu|Seur|Kolleja|Paino|Toimitila|Luotsiasema|Vastaanottaja|Vastaanotto)$/i.test(st))continue;if(back>1&&bad.has(ts[0].toLowerCase()))continue;const cand=st+' '+nm[1]+nm[2];if(!best||score>best.score||score===best.score&&st.length<best.street.length)best={street:st,number:nm[1]+nm[2],score}}}
 return best?best.street+' '+best.number:''}
function groupLines(items){const groups=[];for(const it of items){const y=it.y;let g=groups.find(x=>Math.abs(x.y-y)<=3.5);if(!g){g={y,items:[]};groups.push(g)}g.items.push(it)}return groups.sort((a,b)=>b.y-a.y).map(g=>norm(g.items.sort((a,b)=>a.x-b.x).map(x=>x.str).join(' '))).filter(Boolean)}
function findRecipientBlock(lines){const labels=[];for(let i=0;i<lines.length;i++){if(/^Vastaanottaja:\s*$/i.test(lines[i]))labels.push(i)}let best=-1,bscore=-1;for(const idx of labels){const rem=lines.slice(idx+1,Math.min(lines.length,idx+14));let score=0;if(rem.some(postal))score+=100;if(rem.some(x=>street(x)))score+=100;if(rem.some(x=>/\b(?:Finland|Suomi)\b/i.test(x)))score+=10;if(rem.some(x=>metadata.test(x)))score-=100;if(score>bscore){bscore=score;best=idx}}return best>=0?lines.slice(best+1,best+14):[]}
function chooseRecipient(lines){const candidates=[];for(let i=0;i<lines.length;i++){let line=norm(lines[i]).replace(/\s+(?:Toimitusehto|Myyjä|Arvioitu toimituspvm|Pyydetty toimituspvm|Toimitusohje)\s*:?.*$/i,'').trim(' ,;:');if(!line||line.length<3||line.length>100||/^(Finland|Suomi)$/i.test(line)||postal(line)||metadata.test(line)||/^\+?\d[\d\s()\-]{6,}$/.test(line)||street(line))continue;let score=30;if(/\b(?:Oy|Oyj|Ab|Ltd|Inc|Corp)\.?$/i.test(line))score+=70;if(/\b(?:Mehiläinen|Attendo|Aava|VTT|Luotea|Caverion|Terveystalo|HUS|Kesko|S-ryhmä|Prisma|K-Citymarket)\b/i.test(line))score+=35;if(/^[A-ZÅÄÖÜ0-9 &.,'’()\/-]{4,}$/.test(line))score+=25;if(/\b(?:Kauppakeskus|Ostoskeskus|Kampus|Toimipiste|Sairaala|Hoivakoti|Palvelukeskus|Klinikka|Terveyspalvelut)\b/i.test(line))score+=18;if(/^(?:[A-ZÅÄÖ][a-zåäöüéè-]+)(?:\s+[A-ZÅÄÖ][a-zåäöüéè-]+){1,3}$/.test(line))score-=35;if(/\b(?:yhteyshenkilö|kontaktperson|contact|vastaanotto|vastaanottaja)\b/i.test(line))score-=50;candidates.push({line,score,i})}if(!candidates.length)return tr('none');candidates.sort((a,b)=>b.score-a.score||a.i-b.i);return candidates[0].line}
function parseVisual(items){const label=items.filter(x=>x.str.trim()==='Vastaanottaja:').sort((a,b)=>b.y-a.y)[0];if(!label)return {recipient:tr('none'),address:'',label:null,lines:[]};const region=items.filter(x=>x.x>=label.x-20&&x.x<=label.x+240&&x.y<label.y-2&&x.y>label.y-180);const lines=groupLines(region);const postalLines=lines.map((text,index)=>({text,index})).filter(x=>postal(x.text));const streets=lines.map((text,index)=>({text,index,street:street(text)})).filter(x=>x.street);let address='';let best=null;for(const p of postalLines)for(const s of streets){const d=Math.abs(p.index-s.index);if(d>8)continue;let score=100-d*8;if(s.index<=p.index)score+=10;if(/\b(?:Ateriap|Ateriapalvelu|Luotsiasema|Toimitila|Seur|Kolleja|Paino)\b/i.test(s.street))score-=35;if(!best||score>best.score)best={address:s.street+', '+norm(p.text),score}}if(best)address=best.address;const recipient=chooseRecipient(lines);return {recipient,address,label,lines}}
async function extract(file){const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;let best=null;for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const tc=await page.getTextContent();const items=tc.items.map(it=>({str:it.str||'',x:it.transform?.[4]||0,y:it.transform?.[5]||0,w:it.width||0,h:it.height||0})).filter(x=>x.str.trim());const parsed=parseVisual(items);if(parsed.label&&(parsed.address||parsed.recipient!==tr('none'))){best={page, pageNumber:p, parsed};break}}
 if(!best){let text='';for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const tc=await page.getTextContent();text+=tc.items.map(x=>x.str).join('\n')+'\n'}const lines=text.split(/\r?\n/).map(norm).filter(Boolean);const block=findRecipientBlock(lines);const addrLines=block.map((x,i)=>({x,i}));let a='';for(const x of addrLines){const st=street(x.x);if(st){const p=addrLines.find(y=>postal(y.x));if(p&&Math.abs(p.i-x.i)<=8){a=st+', '+p.x;break}}}best={page:await pdf.getPage(1),pageNumber:1,parsed:{recipient:chooseRecipient(block),address:a,label:null,lines:block}}}
 return {...best,file,pdf}}
async function cropPreview(pdf,pageNumber,label){if(!label)return null;const page=await pdf.getPage(pageNumber);const vp=page.getViewport({scale:1.8});const full=document.createElement('canvas');full.width=Math.ceil(vp.width);full.height=Math.ceil(vp.height);await page.render({canvasContext:full.getContext('2d'),viewport:vp}).promise;const scale=vp.scale;const x=Math.max(0,(label.x-20)*scale), y=Math.max(0,(vp.height-(label.y+42)*scale));const w=Math.min(full.width-x,360*scale),h=Math.min(full.height-y,220*scale);const c=document.createElement('canvas');c.width=Math.max(1,Math.floor(w));c.height=Math.max(1,Math.floor(h));c.getContext('2d').drawImage(full,x,y,w,h,0,0,c.width,c.height);return c.toDataURL('image/png')}

const ROUTE_CACHE_KEY='ajGeocodeCacheV1';
let routeBusy=false;
function loadGeoCache(){try{return JSON.parse(localStorage.getItem(ROUTE_CACHE_KEY)||'{}')}catch{return {}}}
function saveGeoCache(c){try{localStorage.setItem(ROUTE_CACHE_KEY,JSON.stringify(c))}catch{}}
const geoNorm=s=>norm(s).toLowerCase();
let lastGeoRequest=0;
async function waitGeoSlot(){
  const now=Date.now(), wait=Math.max(0,1200-(now-lastGeoRequest));
  if(wait) await new Promise(r=>setTimeout(r,wait));
  lastGeoRequest=Date.now();
}
async function geocode(address){
  const key=geoNorm(address); if(!key)return null;
  const cache=loadGeoCache(); if(cache[key])return cache[key];
  await waitGeoSlot();
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=fi&q='+encodeURIComponent(address);
  const res=await fetch(url,{headers:{'Accept':'application/json'}});
  if(res.status===429) throw new Error('Osoitehakupalvelu palautti 429 Too Many Requests -vastauksen.');
  if(!res.ok) throw new Error('Osoitehaku epäonnistui: HTTP '+res.status);
  const data=await res.json();
  if(!data.length)return null;
  const p={lat:Number(data[0].lat),lon:Number(data[0].lon),display:data[0].display_name||address};
  cache[key]=p; saveGeoCache(cache); return p;
}
async function optimizeRoute(start,stops,end){
  if(!stops.length)return {order:[],distance:0,duration:0};
  const points=[start,...stops]; if(end)points.push(end);
  const coords=points.map(p=>`${p.lon},${p.lat}`).join(';');
  const options=end?'source=first&destination=last&roundtrip=false&overview=false':'source=first&destination=any&roundtrip=false&overview=false';
  const url='https://routing.openstreetmap.de/routed-car/trip/v1/driving/'+coords+'?'+options;
  const res=await fetch(url);
  if(res.status===429)throw new Error('Reitityspalvelu palautti 429 Too Many Requests -vastauksen.');
  if(!res.ok)throw new Error('Reitityspalvelu epäonnistui: HTTP '+res.status);
  const root=await res.json();
  if(root.code!=='Ok')throw new Error('Reitityspalvelu ei pystynyt laskemaan reittiä.'+(root.message?' '+root.message:''));
  const lastInput=points.length-1;
  const order=root.waypoints.map((wp,inputIndex)=>({inputIndex,optimizedIndex:Number(wp.waypoint_index)}))
    .filter(x=>x.inputIndex>0 && (!end || x.inputIndex<lastInput))
    .sort((a,b)=>a.optimizedIndex-b.optimizedIndex)
    .map(x=>x.inputIndex-1);
  if(order.length!==stops.length)throw new Error('Reitityspalvelun optimointitulos oli puutteellinen.');
  const trip=root.trips?.[0];
  return {order,distance:Number(trip?.distance||0),duration:Number(trip?.duration||0)};
}
function formatRouteResult(distance,duration){
  const km=(distance/1000).toFixed(1);
  const min=Math.round(duration/60);
  const h=Math.floor(min/60),m=min%60;
  return state.lang==='fi'?`Reitti järjestetty: ${km} km, arvio ${h?`${h} h `:''}${m} min`:`Route optimized: ${km} km, estimated ${h?`${h} h `:''}${m} min`;
}
async function runOptimize(){
  if(routeBusy)return;
  const valid=state.rows.filter(r=>r.accepted&&r.address);
  if(!valid.length){alert(state.lang==='fi'?'Hyväksy vähintään yksi osoite ennen optimointia.':'Accept at least one address before optimizing.');return}
  routeBusy=true;
  const btn=document.getElementById('optimize'), old=btn.textContent;
  btn.disabled=true; btn.textContent=state.lang==='fi'?'Lasketaan reitti...':'Calculating route...';
  try{
    const startAddress=norm(state.start);
    if(!startAddress)throw new Error(state.lang==='fi'?'Lähtöosoite puuttuu.':'Start address is missing.');
    const start=await geocode(startAddress);
    if(!start)throw new Error((state.lang==='fi'?'Lähtöosoitetta ei löytynyt: ':'Start address not found: ')+startAddress);
    const geos=[];
    for(let i=0;i<valid.length;i++){
      btn.textContent=(state.lang==='fi'?`Haetaan osoitteita ${i+1}/${valid.length}...`:`Geocoding ${i+1}/${valid.length}...`);
      const p=await geocode(valid[i].address);
      if(!p)throw new Error((state.lang==='fi'?'Osoitetta ei löytynyt: ':'Address not found: ')+valid[i].address);
      geos.push(p);
    }
    let end=null;
    if(norm(state.end)){
      btn.textContent=state.lang==='fi'?'Haetaan pääteosoitetta...':'Geocoding end address...';
      end=await geocode(state.end);
      if(!end)throw new Error((state.lang==='fi'?'Pääteosoitetta ei löytynyt: ':'End address not found: ')+state.end);
    }
    btn.textContent=state.lang==='fi'?'Optimoidaan...':'Optimizing...';
    const result=await optimizeRoute(start,geos,end);
    const orderedRows=result.order.map(i=>valid[i]);
    const invalid=state.rows.filter(r=>!r.accepted||!r.address);
    state.rows=[...orderedRows,...invalid];
    state.optimized=true;
    render();
    document.getElementById('status').textContent=formatRouteResult(result.distance,result.duration);
    log(`Reitti optimoitu: ${orderedRows.length} pysäkkiä, ${Math.round(result.distance)} m, ${Math.round(result.duration)} s`);
  }catch(e){
    log('Reitin optimointi epäonnistui: '+(e?.stack||e));
    alert((state.lang==='fi'?'Reitin optimointi epäonnistui:\n':'Route optimization failed:\n')+(e?.message||e));
  }finally{
    routeBusy=false; btn.disabled=state.rows.length===0||state.rows.some(r=>!r.accepted||!r.address); btn.textContent=old;
  }
}

const rowsEl=document.getElementById('rows');
function render(){
  rowsEl.innerHTML='';
  state.rows.forEach((r,i)=>{
    const trEl=document.createElement('tr');
    trEl.className=!r.address?'bad':r.accepted?'ok':'';
    trEl.innerHTML=`<td>${i+1}</td><td><input data-i="${i}" data-f="recipient" value="${esc(r.recipient)}"></td><td><input data-i="${i}" data-f="address" value="${esc(r.address)}"></td><td class="status">${r.address?(r.accepted?tr('ok'):tr('reviewStatus')):tr('noAddress')}</td><td><button data-review="${i}">✎</button></td>`;
    rowsEl.appendChild(trEl);
  });
  document.getElementById('optimize').disabled=state.rows.length===0||state.rows.some(r=>!r.accepted||!r.address);document.getElementById('mergePdf').disabled=!state.optimized;
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function processFiles(files){state.rows=[];state.optimized=false;document.getElementById('status').textContent=tr('processing');for(const file of [...files]){try{const r=await extract(file);r.accepted=!!r.parsed.address;r.recipient=r.parsed.recipient;r.address=r.parsed.address;r.file=file;r.page=r.pageNumber;r.pdf=r.pdf;r.label=r.parsed.label;r.preview=null;state.rows.push(r);log('PDF käsitelty: '+file.name+' | osoite '+(r.address?'löytyi':'ei löytynyt'));}catch(e){state.rows.push({file,recipient:tr('none'),address:'',accepted:false});log('PDF-käsittely epäonnistui: '+file.name+' | '+e.name)}}document.getElementById('status').textContent=`${state.rows.length} PDF`;render();const first=state.rows.findIndex(r=>!r.address||r.recipient===tr('none'));if(first>=0)openReview(first)}
const drop=document.getElementById('drop');document.getElementById('files').onchange=e=>processFiles(e.target.files);drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();processFiles(e.dataTransfer.files)};
function dateStamp(){const d=new Date();return d.toISOString().slice(0,10)}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function mergePdfs(){
  if(!state.optimized){alert(state.lang==='fi'?'Optimoi reitti ensin.':'Optimize the route first.');return}
  const btn=document.getElementById('mergePdf');
  const old=btn.textContent;btn.disabled=true;btn.textContent=state.lang==='fi'?'Yhdistetään...':'Merging...';
  try{
    const out=await PDFDocument.create();
    for(let i=0;i<state.rows.length;i++){
      const r=state.rows[i];
      btn.textContent=state.lang==='fi'?`Yhdistetään ${i+1}/${state.rows.length}...`:`Merging ${i+1}/${state.rows.length}...`;
      const bytes=await r.file.arrayBuffer();
      const src=await PDFDocument.load(bytes,{ignoreEncryption:true});
      const pages=await out.copyPages(src,src.getPageIndices());
      pages.forEach(page=>out.addPage(page));
    }
    const bytes=await out.save();
    downloadBlob(new Blob([bytes],{type:'application/pdf'}),`Ajo_${dateStamp()}.pdf`);
    document.getElementById('status').textContent=state.lang==='fi'?`PDF:t yhdistetty: ${state.rows.length} lähetettä`:`PDFs merged: ${state.rows.length} referrals`;
    log(`PDF:t yhdistetty: ${state.rows.length} tiedostoa`)
  }catch(e){
    log('PDF-yhdistäminen epäonnistui: '+(e?.stack||e));
    alert((state.lang==='fi'?'PDF:ien yhdistäminen epäonnistui:\n':'PDF merge failed:\n')+(e?.message||e));
  }finally{btn.disabled=!state.optimized;btn.textContent=old}
}
document.getElementById('optimize').onclick=runOptimize;document.getElementById('acceptAll').onclick=()=>{state.rows.forEach(r=>{if(r.address)r.accepted=true});state.optimized=false;render();log('Kaikki löydetyt osoitteet hyväksytty')};document.getElementById('clear').onclick=()=>{state.rows=[];state.optimized=false;render();document.getElementById('status').textContent='';log('Työlista tyhjennetty')};document.getElementById('mergePdf').onclick=mergePdfs;
document.getElementById('settings').onclick=()=>document.getElementById('settingsDlg').showModal();document.getElementById('closeSettings').onclick=()=>document.getElementById('settingsDlg').close();document.getElementById('lang').onchange=e=>{state.lang=e.target.value;localStorage.ajLang=state.lang;applyLang();render()};document.getElementById('start').onchange=e=>{state.start=e.target.value;localStorage.ajStart=state.start};document.getElementById('end').onchange=e=>{state.end=e.target.value;localStorage.ajEnd=state.end};document.getElementById('downloadLog').onclick=()=>{const b=new Blob([JSON.stringify(JSON.parse(localStorage.ajLog||'[]'),null,2)],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='AjoJarjestys-log.txt';a.click();URL.revokeObjectURL(a.href)};
function openReview(i){state.reviewIndex=i;const r=state.rows[i];document.getElementById('editRecipient').value=r.recipient||'';document.getElementById('editAddress').value=r.address||'';document.getElementById('queue').textContent=`${i+1} / ${state.rows.length} — ${r.file.name}`;document.getElementById('previewStatus').textContent='';document.getElementById('previewImg').src='';document.getElementById('reviewDlg').showModal();cropPreview(r.pdf,r.page,r.label).then(src=>{if(src)document.getElementById('previewImg').src=src;else document.getElementById('previewStatus').textContent='PDF-esikatselua ei voitu rajata.'}).catch(e=>document.getElementById('previewStatus').textContent='PDF-esikatselu epäonnistui: '+e.name)}
rowsEl.onclick=e=>{const b=e.target.closest('[data-review]');if(b)openReview(+b.dataset.review)};rowsEl.onchange=e=>{const i=e.target.dataset.i;if(i!==undefined){state.rows[+i][e.target.dataset.f]=e.target.value;state.rows[+i].accepted=!!state.rows[+i].address;state.optimized=false;render()}};
document.getElementById('save').onclick=()=>{const r=state.rows[state.reviewIndex];r.recipient=norm(document.getElementById('editRecipient').value);r.address=norm(document.getElementById('editAddress').value);r.accepted=!!r.address;document.getElementById('reviewDlg').close();render();log('Osoite/vastaanottaja korjattu')};document.getElementById('cancel').onclick=()=>document.getElementById('reviewDlg').close();document.getElementById('prev').onclick=()=>{if(state.reviewIndex>0)openReview(state.reviewIndex-1)};document.getElementById('next').onclick=()=>{if(state.reviewIndex<state.rows.length-1)openReview(state.reviewIndex+1)};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(e=>log('SW '+e.name));log('AjoJärjestys PWA v3.7.12 käynnistetty');
